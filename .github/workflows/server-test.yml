name: Server test
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Run dedicated server until it is up (or crashes)
        run: |
          chmod +x gradlew
          mkdir -p run && echo "eula=true" > run/eula.txt
          ./gradlew runServer > server-out.txt 2>&1 &
          for i in $(seq 1 120); do
            sleep 5
            if grep -q "Done (" run/logs/latest.log 2>/dev/null; then echo "SERVER STARTED"; break; fi
            if grep -qE "FATAL|Failed to start|crash report" server-out.txt; then echo "SERVER CRASHED"; break; fi
          done
          sleep 5
          pkill -f runServer || true
          pkill -f java || true
      - name: Save logs to 'testlog' branch
        if: always()
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          cp $GITHUB_WORKSPACE/server-out.txt . || true
          cp $GITHUB_WORKSPACE/run/logs/latest.log . || true
          cp -r $GITHUB_WORKSPACE/run/crash-reports . || true
          git init -q -b testlog
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Server test logs"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" testlog
