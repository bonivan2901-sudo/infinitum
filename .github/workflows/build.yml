name: Build mod
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: infinitum-mod
          path: build/libs/*.jar
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Infinitum (последняя сборка)
          body: Готовый мод для Forge 1.20.1 — скачай .jar ниже и положи в папку mods.
          files: build/libs/*.jar
          make_latest: true
      - name: Store jar in 'jar' branch
        run: |
          mkdir /tmp/out && cp build/libs/*.jar /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan jar
          git rm -rf . > /dev/null
          cp /tmp/out/*.jar .
          git add *.jar
          git commit -m "Built jar"
          git push -f origin jar
